---
- name: Update and upgrade apt packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Create service group
  ansible.builtin.group: "name=cheqd system=true"

- name: Create service user
  ansible.builtin.user: "name=cheqd home=/home/cheqd system=true group=cheqd shell=/bin/bash"

- name: Change user folder to more permissive
  ansible.builtin.file: "path=/home/cheqd mode=0755"

- name: Set .cheqdnode directory owner and group to cheqd
  ansible.builtin.file:
    path: /home/cheqd/.cheqdnode/
    owner: cheqd
    group: cheqd
    state: directory
    recurse: true

- name: Creates config directory
  become: true
  become_user: cheqd
  ansible.builtin.file:
    path: /home/cheqd/.cheqdnode/config
    state: directory
    mode: 0700

- name: Create cosmovisor directory structure
  file:
    path: "{{ item }}"
    state: directory
    owner: "cheqd"
    group: "cheqd"
    mode: '0755'
  with_items:
    - "{{ cosmovisor_dir }}"
    - "{{ cosmovisor_dir }}/genesis"
    - "{{ cosmovisor_dir }}/genesis/bin"

- name: Download cheqd-noded binary to cosmovisor genesis
  get_url:
    url: "https://github.com/cheqd/cheqd-node/releases/download/v{{ version }}/cheqd-noded-{{ version }}-linux-{{ system_architecture}}.tar.gz"
    dest: "{{ cosmovisor_dir }}/genesis/bin/cheqd-noded"
    mode: '0755'
    owner: "cheqd"
    group: "cheqd"

- name: Create cosmovisor current symlink
  file:
    src: "{{ cosmovisor_dir }}/genesis"
    dest: "{{ cosmovisor_dir }}/current"
    state: link
    owner: "cheqd"
    group: "cheqd"

- name: Create system-wide cheqd-noded symlink
  file:
    src: "{{ cosmovisor_dir }}/current/bin/cheqd-noded"
    dest: "/usr/bin/cheqd-noded"
    state: link
    owner: root
    group: root

- name: Download cosmovisor binary
  get_url:
    url: "https://github.com/cosmos/cosmos-sdk/releases/download/cosmovisor%2F{{ cosmovisor_version }}/cosmovisor-{{ cosmovisor_version }}-linux-{{ system_architecture}}.tar.gz"
    dest: "/tmp/cosmovisor-{{ cosmovisor_version }}-linux-amd64.tar.gz"
    mode: '0644'
    owner: root
    group: root

- name: Extract cosmovisor archive
  unarchive:
    src: "/tmp/cosmovisor-{{ cosmovisor_version }}-linux-amd64.tar.gz"
    dest: "/tmp/"
    remote_src: yes
    creates: "/tmp/cosmovisor-{{ cosmovisor_version }}-linux-amd64"

- name: Move cosmovisor binary to /usr/bin
  copy:
    src: "/tmp/cosmovisor"
    dest: "/usr/bin/cosmovisor"
    mode: '0755'
    owner: root
    group: root
    remote_src: yes

- name: Clean up temporary files
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "/tmp/cosmovisor-{{ cosmovisor_version }}-linux-amd64.tar.gz"
    - "/tmp/LICENSE"
    - "/tmp/README.md"

- name: Template systemd service file
  template:
    src: cheqd-cosmovisor.service.j2
    dest: "/usr/lib/systemd/system/cheqd-cosmovisor.service"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Reload systemd daemon and enable service
  ansible.builtin.systemd_service:
    name: cheqd-cosmovisor
    daemon_reload: yes
    enabled: yes
  become: true

- name: Download the genesis file
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/cheqd/cheqd-node/main/networks/{{ network }}/genesis.json
    dest: /home/cheqd/.cheqdnode/config/genesis.json
    force: true
    mode: 0644
  become: true
  become_user: cheqd
  when: new_account

- name: Store seeds inside an environment variable
  ansible.builtin.uri:
    url: https://raw.githubusercontent.com/cheqd/cheqd-node/main/networks/{{ network }}/seeds.txt
    return_content: true
  register: seeds
  become: true
  become_user: cheqd
  when: new_account

