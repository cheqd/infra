- name: Update the config.toml file
  become: true
  become_user: cheqd
  ansible.builtin.template:
    src: config.toml.j2
    dest: /home/cheqd/.cheqdnode/config/config.toml
    mode: 0644

- name: Update the app.toml file
  become: true
  become_user: cheqd
  ansible.builtin.template:
    src: app.toml.j2
    dest: /home/cheqd/.cheqdnode/config/app.toml
    mode: 0644

- name: Add price-feeder.toml file
  become: true
  become_user: cheqd
  ansible.builtin.template:
    src: price-feeder.toml.j2
    dest: /home/cheqd/.cheqdnode/config/price-feeder.toml
    mode: 0644

- name: Creates data directory
  become: true
  become_user: cheqd
  ansible.builtin.file:
    path: /home/cheqd/.cheqdnode/data
    state: directory
    mode: 0700

- name: Create priv_validator_state.json file
  become: true
  become_user: cheqd
  ansible.builtin.template:
    src: priv_validator_state.json.j2
    dest: /home/cheqd/.cheqdnode/data/priv_validator_state.json
    mode: 0644

- name: Configure state sync data
  when: statesync_enabled
  block:
    - name: Get latest block height from RPC
      ansible.builtin.uri:
        url: "{{ 'https://rpc.cheqd.network:443' if network == 'testnet' else 'https://rpc.cheqd.net:443' }}/block"
        return_content: true
      register: latest_block_response

    - name: Calculate trust height
      ansible.builtin.set_fact:
        statesync_trust_height: "{{ (latest_block_response.json.result.block.header.height | int) - 2000 }}"

    - name: Get trust hash at trust height
      ansible.builtin.uri:
        url: "{{ 'https://rpc.cheqd.network:443' if network == 'testnet' else 'https://rpc.cheqd.net:443' }}/block?height={{ statesync_trust_height }}"
        return_content: true
      register: trust_block_response

    - name: Set trust hash fact
      ansible.builtin.set_fact:
        statesync_trust_hash: "{{ trust_block_response.json.result.block_id.hash }}"

    - name: Enable state sync in config.toml
      become: true
      become_user: cheqd
      ansible.builtin.lineinfile:
        path: /home/cheqd/.cheqdnode/config/config.toml
        regexp: '^enable\s*=.*'
        line: 'enable = true'
        insertafter: '^\[statesync\]'

    - name: Configure state sync trust_height
      become: true
      become_user: cheqd
      ansible.builtin.lineinfile:
        path: /home/cheqd/.cheqdnode/config/config.toml
        regexp: '^trust_height\s*=.*'
        line: 'trust_height = {{ statesync_trust_height }}'
        insertafter: '^\[statesync\]'

    - name: Configure state sync trust_hash
      become: true
      become_user: cheqd
      ansible.builtin.lineinfile:
        path: /home/cheqd/.cheqdnode/config/config.toml
        regexp: '^trust_hash\s*=.*'
        line: 'trust_hash = "{{ statesync_trust_hash }}"'
        insertafter: '^\[statesync\]'
